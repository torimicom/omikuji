<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>觀音靈籤 - 神仏の鑑定</title>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Sans-serif;
      background-color: #f7f4ed;
      color: #2b2b2b;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border: 1px solid #e0dacf;
    }
    h1 {
      text-align: center;
      color: #8b0000;
      margin-bottom: 20px;
      font-size: 1.8rem;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    input[type="text"], select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    button {
      width: 100%;
      background-color: #8b0000;
      color: white;
      border: none;
      padding: 12px;
      font-size: 1.1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #a00000;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    #result {
      margin-top: 25px;
      padding: 15px;
      background: #faf8f5;
      border-left: 5px solid #8b0000;
      border-radius: 4px;
      white-space: pre-wrap;
      line-height: 1.6;
    }
    .loading {
      text-align: center;
      color: #666;
      font-style: italic;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>觀音靈籤 占い</h1>
  
  <div class="form-group">
    <label for="category">ご相談のカテゴリ：</label>
    <select id="category">
      <option value="仕事・人間関係">仕事・人間関係</option>
      <option value="恋愛・結婚">恋愛・結婚</option>
      <option value="金運・投資">金運・投資</option>
      <option value="健康・病気">健康・病気</option>
      <option value="学業・試験">学業・試験</option>
      <option value="全体運">全体運</option>
    </select>
  </div>

  <div class="form-group">
    <label for="userQuery">具体的なお悩み・状況：</label>
    <textarea id="userQuery" rows="3" placeholder="例：上司と意見が合わず、職場で浮いてしまって辛いです。"></textarea>
  </div>

  <button id="submitBtn" onclick="drawFortune()">おみくじを引いて鑑みる</button>

  <div id="result" style="display: none;"></div>
</div>

<script>
  // テスト用籤データ（第1籤）
  const sampleLot = {
    lot_number: 1,
    title: "鍾離成道",
    fortune: "上籤",
    palace: "子宮",
    summary: "受擁而發",
    poem_original: "開天闢地作良緣\n吉日良時萬物全\n若得此籤非小可\n人行忠正帝王宣"
  };

  async function drawFortune() {
    const category = document.getElementById('category').value;
    const userQuery = document.getElementById('userQuery').value;
    const resultDiv = document.getElementById('result');
    const submitBtn = document.getElementById('submitBtn');

    if (!userQuery.trim()) {
      alert("お悩みやご相談内容を入力してください。");
      return;
    }

    // UI表示の切り替え
    submitBtn.disabled = true;
    submitBtn.innerText = "神仏のお告げを受信中...";
    resultDiv.style.display = "block";
    resultDiv.className = "loading";
    resultDiv.innerText = "神意を伺っております。少々おまちください...";

    // AIへのプロンプト組み立て
    const promptText = `
あなたは觀音靈籤の厳かな神仏の代弁者です。
相談者の「お悩み」と「引き当てた籤（籤詩・吉凶・典故）」の情報をもとに、威厳と慈愛に満ちた言葉で鑑定結果を出力してください。

【相談者の情報】
カテゴリ：${category}
相談内容：${userQuery}

【引いた籤の情報】
籤番号：第${sampleLot.lot_number}籤
籤名・典故：${sampleLot.title}
吉凶：${sampleLot.fortune}（${sampleLot.palace}）
要約：${sampleLot.summary}
籤詩：
${sampleLot.poem_original}

【出力フォーマット】
1. ◆ 神意・お諭し（籤詩を一節引用し、全体のメッセージを厳かに伝える）
2. ◆ 悩みに寄せた解釈（相談内容に直接触れ、この卦が今の状況にどう作用しているか解説する）
3. ◆ 今日から実践すべき「三つの導き」（具体的かつ現実的なアドバイスを3点提示する）
4. ◆ 結び（温かい締めくくりの一言）
`;

    try {
      // Vercel の API Route (/api/fortune) を呼び出す
      const response = await fetch('/api/fortune', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: promptText })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error?.message || data.error || '通信エラーが発生しました');
      }

      // 結果の抽出・表示
      const aiReply = data.candidates[0].content.parts[0].text;
      resultDiv.className = "";
      resultDiv.innerText = aiReply;

    } catch (error) {
      resultDiv.className = "";
      resultDiv.innerText = "【エラー】お告げの取得に失敗しました。\n" + error.message;
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "おみくじを引いて鑑みる";
    }
  }
</script>

</body>
</html>
