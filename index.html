<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>觀音靈籤 - 神仏の鑑定</title>
  <style>
    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Sans-serif;
      background-color: #f7f4ed;
      color: #2b2b2b;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border: 1px solid #e0dacf;
    }
    h1 {
      text-align: center;
      color: #8b0000;
      margin-bottom: 20px;
      font-size: 1.8rem;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    input[type="text"], select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    button {
      width: 100%;
      background-color: #8b0000;
      color: white;
      border: none;
      padding: 12px;
      font-size: 1.1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #a00000;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    #result {
      margin-top: 25px;
      padding: 15px;
      background: #faf8f5;
      border-left: 5px solid #8b0000;
      border-radius: 4px;
      white-space: pre-wrap;
      line-height: 1.6;
    }
    .loading {
      text-align: center;
      color: #666;
      font-style: italic;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>觀音靈籤 占い</h1>
  
  <div class="form-group">
    <label for="category">ご相談のカテゴリ：</label>
    <select id="category">
      <option value="仕事・人間関係">仕事・人間関係</option>
      <option value="恋愛・結婚">恋愛・結婚</option>
      <option value="金運・投資">金運・投資</option>
      <option value="健康・病気">健康・病気</option>
      <option value="学業・試験">学業・試験</option>
      <option value="全体運">全体運</option>
    </select>
  </div>

  <div class="form-group">
    <label for="userQuery">具体的なお悩み・状況：</label>
    <textarea id="userQuery" rows="3" placeholder="例：上司と意見が合わず、職場で浮いてしまって辛いです。"></textarea>
  </div>

  <button id="submitBtn" onclick="drawFortune()">おみくじを引いて鑑みる</button>

  <div id="result" style="display: none;"></div>
</div>
